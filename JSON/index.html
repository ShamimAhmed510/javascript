<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      #post-container {
        max-width: 1160px;
        margin: 50 px auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-gap: 20px;
        row-gap: 30px;
      }

      .post-card {
        border: 1px solid #d9e0de;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 1px 1px 1px 1px grey;
        height: 100%;
      }
      .post-card p {
        text-align: justify;
      }
    </style>
  </head>
  <body>
    <button onclick="LoadData()">Load Data</button>

    <button onclick="LoadtPost()">Load Post</button>

    <div id="post-container">
    </div>

    <script src="./fetch.js"></script>
  </body>
</html>
